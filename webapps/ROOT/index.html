<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MiniTomcatNIO</title>
</head>
<body>
    <h1>MiniTomcatNIO ROOT</h1>
    <p>Static files come from webapps/ROOT.</p>
    <p><a href="/hello">/hello (Servlet)</a></p>
    <p><a href="/app/hello">/app/hello (prefix Servlet)</a></p>
    <p><a href="/cookie">/cookie</a></p>
    <p><a href="/session">/session</a></p>
    <p><a href="/other/">/other/ (second app)</a></p>
    <p><a href="/hello.txt">hello.txt</a></p>
</body>
</html>
